<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk · Proxy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fafafa; background: #000000; }
  .card { width: 100%; max-width: 360px; padding: 32px 26px; border-radius: 20px; text-align: center;
    background: #0a0a0a; border: 1px solid rgba(255,255,255,.18); }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0 0 22px; color: #a3a3a3; font-size: 14px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.22); background: #000000;
    color: #fafafa; font: inherit; font-size: 15px; outline: none; }
  input:focus { border-color: #ffffff; }
  button { padding: 12px; border: 0; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 700;
    font-size: 15px; color: #000000; background: #ffffff; }
  .err { display: none; color: #e5e5e5; font-size: 13px; }
  .err.show { display: block; }
  .back { margin-top: 14px; background: transparent; color: #a3a3a3; border: 1px solid rgba(255,255,255,.22); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Proxy</h1>
    <p>Masukkan kata sandi. Setelah itu tidak perlu masuk lagi.</p>
    <form method="POST" action="/proxy/login">
      <input type="password" name="password" placeholder="Kata sandi" required autofocus autocomplete="current-password">
      <div class="err" id="err">Kata sandi salah.</div>
      <button type="submit">Masuk</button>
    </form>
    <button type="button" class="back" id="backBtn">← Kembali</button>
  </div>
  <script>
    var inFrame = window.parent && window.parent !== window;
    document.getElementById('backBtn').onclick = function () {
      if (inFrame) window.parent.postMessage({ type: 'proxy:close' }, location.origin);
      else location.href = '/';
    };
    if (new URLSearchParams(location.search).get('err') === '1') {
      document.getElementById('err').classList.add('show');
    }
  </script>
</body>
</html>
